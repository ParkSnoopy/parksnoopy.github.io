<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color code file share</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p><a href="../">&lt; back to the tool page</a></p>
    <h1>Color code file share</h1>
    <p class="dim">
      Everything runs in this page. Nothing is uploaded, and nothing leaves your
      device after the page has loaded.
    </p>

    <nav>
      <button id="tab-send" class="tab active" type="button">Send</button>
      <button id="tab-receive" class="tab" type="button">Receive</button>
    </nav>

    <section id="send">
      <label>File <input id="file" type="file" disabled /></label>
      <div class="row">
        <label
          >Code mode
          <select id="mode" disabled></select>
        </label>
        <label
          >Frames per second (<span id="fps-range"></span>)
          <input id="fps" type="number" min="1" max="60" value="30"
        /></label>
      </div>
      <p id="send-info" class="dim">Loading the encoder...</p>
      <div class="shown"><canvas id="code"></canvas></div>
      <p class="dim">Click the code to show it full screen.</p>
      <p id="send-status"></p>
      <p id="send-rate"></p>
      <div class="row">
        <button id="start" type="button" disabled>Start transfer</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="reset-send" type="button" disabled>Reset</button>
        <button id="previous-part" type="button" hidden>Previous part</button>
        <button id="next-part" type="button" hidden>Next part</button>
      </div>
      <p id="send-error" class="error"></p>
    </section>

    <section id="receive" hidden>
      <button id="cam" type="button">Start camera</button>
      <button id="reset" type="button">Reset</button>
      <div class="video"><video id="video" muted playsinline></video></div>
      <p id="rx-status">Camera is off.</p>
      <p id="rx-rate"></p>
      <pre id="rx-stats" class="dim"></pre>
      <pre id="rx-info"></pre>
      <button id="download" type="button" hidden>Download</button>
      <p id="rx-error" class="error"></p>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
