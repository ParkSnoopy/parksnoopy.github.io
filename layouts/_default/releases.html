{{ define "main" }}
<article class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="post-content">
    {{ .Content }}
    <div data-release-repo="{{ .Params.repo }}" aria-busy="false">
      <p data-release-status role="status" hidden></p>
      {{ range .Params.projects }}
        <section class="release" data-project="{{ .slug }}">
          <h2>{{ .name }}</h2>
          <p class="release-meta"></p>
          <ul class="platforms" hidden></ul>
        </section>
      {{ end }}
    </div>
    <noscript>
      <p>Enable JavaScript to load downloads, or
        <a href="https://github.com/{{ .Params.repo }}/releases">view releases on GitHub</a>.</p>
    </noscript>
  </div>
</article>
<script type="module" src="{{ "releases.js" | relURL }}"></script>
{{ end }}
