baseURL = "https://parksnoopy.github.io/"
locale = "en-us"
title = "ParkSnoopy"
theme = "terminal"
pagination.pagerSize = 5

# Required by the theme for Chroma syntax highlighting.
[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 3
  fullWidthTheme = false
  centerTheme = false
  subtitle = "Builder of small tools. Rust, Go, containers."
  readMore = "Read more"
  readOtherPosts = "Read other posts"
  newerPosts = "Newer posts"
  olderPosts = "Older posts"
  missingContentMessage = "Page not found..."
  missingBackButtonLabel = "Back to home page"
  menuMore = "Show more"

  [params.logo]
    logoText = "ParkSnoopy"
    logoHomeLink = "/"

[menu]
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "/portfolio/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "tools"
    name = "Tools"
    url = "/tools/"
    weight = 3
