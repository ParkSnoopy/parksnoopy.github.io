baseURL = "https://parksnoopy.github.io/"
defaultContentLanguage = "en"
title = "ParkSnoopy"
theme = "terminal"
pagination.pagerSize = 5

# Required by the theme for Chroma syntax highlighting.
[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 4
  fullWidthTheme = false
  centerTheme = false
  showLanguageSelector = true

  [params.logo]
    logoText = "ParkSnoopy"

[languages.en]
  locale = "en-US"
  label = "English"
  contentDir = "content/en"
  weight = 1

  [languages.en.params]
  subtitle = "Builder of small tools. Rust, Go, containers."
  readMore = "Read more"
  readOtherPosts = "Read other posts"
  newerPosts = "Newer posts"
  olderPosts = "Older posts"
  missingContentMessage = "Page not found..."
  missingBackButtonLabel = "Back to home page"
  menuMore = "Show more"
  menuLabel = "Menu"

  [[languages.en.menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    pageRef = "/portfolio"
    weight = 1
  [[languages.en.menu.main]]
    identifier = "posts"
    name = "Posts"
    pageRef = "/posts"
    weight = 2
  [[languages.en.menu.main]]
    identifier = "tools"
    name = "Tools"
    pageRef = "/tools"
    weight = 3
  [[languages.en.menu.main]]
    identifier = "releases"
    name = "Releases"
    pageRef = "/releases"
    weight = 4

[languages.ko]
  locale = "ko-KR"
  label = "한국어"
  contentDir = "content/kr"
  weight = 2
  hasCJKLanguage = true

  [languages.ko.params]
  subtitle = "Rust, Go, 컨테이너로 작은 도구를 만듭니다."
  readMore = "더 읽기"
  readOtherPosts = "다른 글 읽기"
  newerPosts = "최신 글"
  olderPosts = "이전 글"
  missingContentMessage = "페이지를 찾을 수 없습니다."
  missingBackButtonLabel = "홈으로 돌아가기"
  menuMore = "더 보기"
  menuLabel = "메뉴"

  [[languages.ko.menu.main]]
    identifier = "portfolio"
    name = "포트폴리오"
    pageRef = "/portfolio"
    weight = 1
  [[languages.ko.menu.main]]
    identifier = "posts"
    name = "글"
    pageRef = "/posts"
    weight = 2
  [[languages.ko.menu.main]]
    identifier = "tools"
    name = "도구"
    pageRef = "/tools"
    weight = 3
  [[languages.ko.menu.main]]
    identifier = "releases"
    name = "다운로드"
    pageRef = "/releases"
    weight = 4
